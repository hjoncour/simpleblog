name: release

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Node 24 bundles npm 11, which supports trusted publishing without
      # the fragile global npm self-upgrade that was failing on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Node 24 normally bundles a newer
      # npm, so only self-upgrade when the bundled one is too old.
      - name: Ensure npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "bundled npm: $NPM_VERSION"
          if [ "$(printf '%s\n11.5.1\n' "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@latest
            echo "upgraded npm: $(npm --version)"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Detect publishable version
        id: release
        run: |
          PACKAGE_NAME=$(node --eval "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name)")
          PACKAGE_VERSION=$(node --eval "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
          SSMVER_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' ssmver.toml)

          if [ -z "$SSMVER_VERSION" ]; then
            echo "Could not read version from ssmver.toml" >&2
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$SSMVER_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match ssmver.toml ($SSMVER_VERSION)" >&2
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm.outputs.already_published != 'true'
        run: npm publish --provenance --access public
